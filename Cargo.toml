[package]
name = "codename-rust-dev"
version = "0.0.1"
edition = "2021"

[dependencies]
# bevy = "0.13.2"
# !! THIS IS JUST FOR FAST RECOMPILES, REMOVE ON REALESE BUILDS
bevy = { version = "0.13.2", features = ["dynamic_linking"] }

# All stuff from bevy page (https://bevyengine.org/learn/quick-start/getting-started/setup/)
[workspace]
resolver = "2" # Important! wgpu/Bevy needs this!

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3